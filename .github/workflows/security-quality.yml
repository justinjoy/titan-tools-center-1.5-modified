name: Security & Quality

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

  phpcs:
    name: PHP CodeSniffer (WPCS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer, cs2pr

      - name: Install PHPCS and WPCS
        run: |
          composer init --no-interaction --name="titan/ci-check"
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --dev squizlabs/php_codesniffer wp-coding-standards/wpcs

      - name: Run PHPCS
        run: vendor/bin/phpcs . --standard=WordPress --extensions=php --ignore=node_modules,vendor,assets --report=checkstyle | cs2pr
        continue-on-error: true
