name: Security & Quality

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  phpcs:
    name: PHP CodeSniffer (WPCS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer, phpcs

      - name: Install WPCS
        run: |
          composer create-project wp-coding-standards/wpcs --no-dev --ignore-platform-reqs ~/wpcs
          phpcs --config-set installed_paths ~/wpcs

      - name: Run PHPCS
        run: phpcs . --standard=WordPress --extensions=php --ignore=node_modules,vendor,assets
