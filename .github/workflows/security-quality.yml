name: Security & Quality

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

  phpcs:
    name: PHP CodeSniffer (WPCS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer, cs2pr

      - name: Install PHPCS and WPCS
        run: |
          composer init --no-interaction --name="titan/ci-check"
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --dev squizlabs/php_codesniffer wp-coding-standards/wpcs

      - name: Run PHPCS
        run: |
          vendor/bin/phpcs --standard=phpcs.xml.dist --report=full --report-file=phpcs-report.txt --report=checkstyle --report-file=phpcs.xml
          cat phpcs.xml | cs2pr
        continue-on-error: true

      - name: Upload PHPCS Report
        uses: actions/upload-artifact@v4
        with:
          name: phpcs-report
          path: phpcs-report.txt

      - name: Job Summary
        run: |
          echo "## 🛡️ PHPCS Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Statistics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          vendor/bin/phpcs --standard=phpcs.xml.dist --report=summary >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Full report available in Artifacts." >> $GITHUB_STEP_SUMMARY
